site_name: LUMINA Documentation
site_description: Large-scale Unified Model for Intelligent Grid Applications
site_url: https://cshjin.github.io/lumina-sdk/
repo_url: https://github.com/cshjin/lumina-sdk
repo_name: argonne-gridfm/lumina-core

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow
    - toc.integrate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            docstring_style: google
            members_order: source
            show_signature_annotations: true
  - mkdocs-jupyter:
      execute: false
      include_source: true
      ignore_h1_titles: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Getting Started:
    - getting-started/index.md
    - Installation: getting-started/installation.md
    - Quickstart: getting-started/quickstart.md
  - Tutorials:
    - tutorials/index.md
    - Training Your First Model: tutorials/training.md
    - Multi-Case Training: tutorials/multi-case.md
    - Evaluation: tutorials/evaluation.md
    - Custom Models: tutorials/custom-models.md
    - HPC Training: tutorials/hpc.md
    - Notebooks:
      - Quickstart (case14): tutorials/notebooks/01_quickstart_case14.ipynb
      - Dataset exploration: tutorials/notebooks/02_dataset_exploration.ipynb
      - Evaluation walkthrough: tutorials/notebooks/03_evaluation_walkthrough.ipynb
      - Physics-informed loss: tutorials/notebooks/04_physics_informed_loss.ipynb
      - DDP on local GPUs: tutorials/notebooks/05_ddp_local_gpus.ipynb
      - Polaris (HPC): tutorials/notebooks/06_polaris_hpc.ipynb
  - API Reference:
    - api/index.md
    - Dataset: api/dataset.md
    - Model: api/model.md
    - Trainer: api/trainer.md
    - Evaluator: api/evaluator.md
    - Loader: api/loader.md
    - Utilities: api/utils.md
  - Configuration: configuration.md
  - Resources:
    - HuggingFace Integration: huggingface.md
    - Polaris Setup: polaris.md
    - Perlmutter Setup: perlmutter.md
    - W&B Sweeps on Perlmutter: wandb_sweep_perlmutter.md
