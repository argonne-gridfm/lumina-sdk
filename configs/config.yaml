---
root: "./opf_data/"
logging_dir: "./logs/"
checkpoint_dir: "./ddp_checkpoints/"
optimizer:
  AdamW:
    lr: 1.0e-03
    betas: 
      - 0.9
      - 0.999
    eps: 1.0e-08
    weight_decay: 0.01
scheduler:
  type: "cosine"
  t_max: null
  eta_min: 0.0
lagrangian:
  base_loss_type: "mse"
  mu_0: 0.001 
  tolerance: 1.0e-06
  constraint_tolerance: 0.01
  max_outer_iterations: 20
  max_inner_iterations: 200  # This is currently not used in the code; but kept for future use.
  mu_increase_factor: 1.5
  max_mu: 10000.0
  warmup_epochs: 5
  ema_beta: 0.0 
  penalty_check_interval: 1
  penalty_drop_ratio: 0.5
  penalty_increase_factor: 1.5
  multiplier_clip: 1000.0
  multiplier_improve_ratio: 0.9  # <= 0 keeps current always-update behavior
  multiplier_check_interval: 1
  multiplier_min_improve: 0.0
  normalize_constraints: true
  verbose: false
  warmup_samples: 12000
  penalty_check_samples: 12000
  multiplier_check_samples: 12000
train_split: 0.8
val_split: 0.1
loader:
  batch_size: 16
  shuffle: true
  num_workers: 0
training:
  max_epochs: 10
  patience: 100000
  max_global_samples: 500000
  global_batch_size: 8192
  score_alpha: 1.0
  gradient_clip_val: 1.0
  gradient_clip_algorithm: "norm"
  accumulate_grad_batches: 1
  log_every_n_steps: 0
  log_every_n_samples: 8192
  val_every_n_epochs: 0
  val_every_n_samples: 40960
  val_subset_samples: 0
  throughput_enabled: false
  log_normalized_violation: false
  violation_eval_p: 1.0
  violation_eval_min_batches: 1
  violation_eval_seed: 0
checkpointing:
  monitor: "val/score"
  save_last: true
  every_n_epochs: 0
  every_n_samples: 0
