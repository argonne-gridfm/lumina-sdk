---
root: "./opf_data/"
logging_dir: "./logs/"
optimizer:
  Adam:
    lr: 1.0e-04
    betas: 
      - 0.9
      - 0.999
    eps: 1.0e-08
    weight_decay: 0
  AdamW:
    lr: 1.0e-03
    betas: 
      - 0.9
      - 0.999
    eps: 1.0e-08
    weight_decay: 0.01
lagrangian:
  mu_0: 0.1
  tolerance: 1.0e-06
  constraint_tolerance: 0.01
  max_outer_iterations: 20
  max_inner_iterations: 200  # <= Not used
  mu_increase_factor: 1.5
  max_mu: 10000.0
  warmup_epochs: 5
  ema_beta: 0.9
  penalty_check_interval: 1
  penalty_drop_ratio: 0.5
  penalty_increase_factor: 1.5
  multiplier_clip: 1000.0
  multiplier_improve_ratio: 0.9  # <= 0 keeps current always-update behavior
  multiplier_check_interval: 1
  multiplier_min_improve: 0.0
  normalize_constraints: true
  verbose: false
trainer:
  accelerator: "auto"
  strategy: "ddp_find_unused_parameters_true"
  devices: 1
  num_nodes: 1
  precision: 32
  fast_dev_run: false
  gradient_clip_val: 1.0
  max_epochs: 100
  min_epochs: null
  max_steps: -1
  min_steps: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: null
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: 1.0
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 2
  log_every_n_steps: 50
  enable_checkpointing: true
  enable_progress_bar: true
  enable_model_summary: true
  accumulate_grad_batches: 1
  gradient_clip_algorithm: "norm"
  deterministic: false
  benchmark: null
  inference_mode: true
  use_distributed_sampler: true
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins: null
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: "./lightning/"
