# Configuration for Augmented Lagrangian Loss Training
# This loss method uses quadratic penalties and adapting Lagrange multipliers
# to enforce power flow constraints during training.

loss_type: augmented_lagrangian

# Lagrangian-specific configuration
lagrangian:
  # Initial penalty parameter
  mu_0: 0.1
  
  # Convergence tolerance
  tolerance: 1.0e-6
  
  # Constraint satisfaction tolerance
  constraint_tolerance: 0.01
  
  # Maximum outer iterations (for constraint satisfaction)
  max_outer_iterations: 20

  # Sample-based scheduling (set to null to use epoch-based scheduling)
  warmup_samples: null
  penalty_check_samples: null
  multiplier_check_samples: null
  
  # Factor to increase penalty parameter
  mu_increase_factor: 1.0
  
  # Maximum penalty parameter value
  max_mu: 100.0
  
  # Whether to normalize constraints
  normalize_constraints: true
  
  # Verbose logging
  verbose: false

# Example usage:
# python example/opf/train_opf.py --case case14 --loss_type augmented_lagrangian --config configs/config.yaml
