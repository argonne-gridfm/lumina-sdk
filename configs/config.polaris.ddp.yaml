---
root: "/eagle/GridFM/datasets/acopf/"
logging_dir: "/eagle/GridFM/lumina/logs/"
checkpoint_dir: "/eagle/GridFM/lumina/ddp_checkpoints/"
optimizer:
  Adam:
    lr: 1.0e-04
    betas: 
      - 0.9
      - 0.999
    eps: 1.0e-08
    weight_decay: 0
  AdamW:
    lr: 1.0e-03
    betas: 
      - 0.9
      - 0.999
    eps: 1.0e-08
    weight_decay: 0.01
train_split: 0.8
val_split: 0.1
loader:
  batch_size: 32
  shuffle: true
  num_workers: 0
training:
  max_epochs: 10
  patience: 10 
  max_global_samples: 150000
  global_batch_size: 0
  score_alpha: 1.0
  gradient_clip_val: 1.0
  gradient_clip_algorithm: "norm"
  accumulate_grad_batches: 1
  log_every_n_steps: 50
  log_every_n_samples: 2048
  val_every_n_epochs: 1
  val_every_n_samples: 0
checkpointing:
  monitor: "val_loss"
  save_last: true
  every_n_epochs: 1
  every_n_samples: 0
