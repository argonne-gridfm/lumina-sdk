command:
  - bash
  - -lc
  - ./scripts/perlmutter/sweep/launch.hgt.sh
method: bayes
metric:
  name: val/score
  goal: minimize
parameters:
  wandb_project:
    value: lumina-sweep-hgt-stage1
  optimizer.AdamW.lr:
    distribution: log_uniform_values
    min: 1e-5
    max: 5e-4
  optimizer.AdamW.weight_decay:
    distribution: log_uniform_values
    min: 1e-8
    max: 1e-2
early_terminate:
  type: hyperband
  min_iter: 2
  max_iter: 5
  s: 2
