command:
  - bash
  - -lc
  - ./scripts/perlmutter/sweep/iclr/launch.gin.sh
method: bayes
metric:
  name: val/score
  goal: minimize
parameters:
  wandb_project:
    value: lumina-sweep-ICLR-gin-stage1
  models.GIN.num_layers:
    values: [3, 4, 6]
  models.GIN.hidden_dim:
    values: [128, 256, 512]
  models.GIN.dropout:
    distribution: uniform
    min: 0.0
    max: 0.3
  optimizer.AdamW.lr:
    distribution: log_uniform_values
    min: 1e-4
    max: 3e-3
  optimizer.AdamW.weight_decay:
    distribution: log_uniform_values
    min: 1e-6
    max: 1e-2
  training.gradient_clip_val:
    distribution: uniform
    min: 0.5
    max: 2.0
early_terminate:
  type: hyperband
  min_iter: 600000
