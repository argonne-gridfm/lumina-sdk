---
root: "/global/cfs/cdirs/amsc004/datasets/"
logging_dir: "/global/cfs/cdirs/amsc004/lumina/logs/"
checkpoint_dir: "/global/cfs/cdirs/amsc004/lumina/ddp_checkpoints/"
optimizer:
  Adam:
    lr: 1.0e-04
    betas: 
      - 0.9
      - 0.999
    eps: 1.0e-08
    weight_decay: 0
  AdamW:
    lr: 1.0e-03
    betas: 
      - 0.9
      - 0.999
    eps: 1.0e-08
    weight_decay: 0.01
lagrangian:
  mu_0: 0.1
  tolerance: 1.0e-06
  constraint_tolerance: 0.01
  max_outer_iterations: 20
  max_inner_iterations: 200  # This is currently not used in the code; but kept for future use.
  mu_increase_factor: 1.5
  max_mu: 10000.0
  warmup_epochs: 5
  ema_beta: 0.9
  penalty_check_interval: 1
  penalty_drop_ratio: 0.5
  penalty_increase_factor: 1.5
  multiplier_clip: 1000.0
  multiplier_improve_ratio: 0.9  # <= 0 keeps current always-update behavior
  multiplier_check_interval: 1
  multiplier_min_improve: 0.0
  normalize_constraints: true
  verbose: false
train_split: 0.8
val_split: 0.1
loader:
  batch_size: 32
  shuffle: true
  num_workers: 0
training:
  max_epochs: 10
  patience: 10 
  gradient_clip_val: 1.0
  gradient_clip_algorithm: "norm"
  accumulate_grad_batches: 1
  log_every_n_steps: 50
  val_check_interval: 1
checkpointing:
  monitor: "val_loss"
  save_last: true
  every_n_epochs: 1